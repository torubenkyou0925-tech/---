<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アトリエ桂 お問い合わせ</title>
  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="email"], textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    textarea {
      height: 120px;
    }
    button, .btn-line {
      width: 100%;
      padding: 14px;
      background-color: #06C755;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      box-sizing: border-box;
    }
    button:disabled {
      background-color: #ccc;
    }
    #step-line, #step-complete, #loading {
      display: none;
      text-align: center;
    }
    .status-msg {
      margin: 20px 0;
      padding: 15px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      color: #166534;
    }
  </style>
</head>
<body>

  <h2>アトリエ桂 ご相談フォーム</h2>

  <!-- 1. 入力フォーム -->
  <div id="step-form">
    <form id="contactForm">
      <div class="form-group">
        <label for="name">お名前</label>
        <input type="text" id="name" required placeholder="山田 太郎">
      </div>
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" required placeholder="example@example.com">
      </div>
      <div class="form-group">
        <label for="message">ご相談内容</label>
        <textarea id="message" required placeholder="愛犬のお召しものについてのご相談など"></textarea>
      </div>
      <button type="submit" id="submitBtn">送信する</button>
    </form>
  </div>

  <!-- ローディング表示 -->
  <div id="loading">
    <p>処理中です。しばらくお待ちください...</p>
  </div>

  <!-- 2. LINE連携案内画面 -->
  <div id="step-line">
    <div class="status-msg">
      フォームの送信が完了しました！
    </div>
    <p>続いて、公式LINEと連携してご相談をスムーズに進めましょう。</p>
    <button id="lineConnectBtn" class="btn-line">LINEで相談を続ける</button>
  </div>

  <!-- 3. 完了画面 -->
  <div id="step-complete">
    <div class="status-msg">
      🎉 LINE連携が完了しました!
    </div>
    <p>アトリエ桂のLINE公式アカウントに確認メッセージをお送りしました。</p>
    <p>LINEのトーク画面を開いてご確認ください。</p>
  </div>


<script>
  // LINE公式アカウントのBasic ID（@から始まるIDを設定してください）
  const LINE_BASIC_ID = "@031qggrt"; // ← ★ご自身のLINE IDに変更（例: @atelier_katsura）

  // GASのWebアプリURL
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyi08pD8_zyrQaZWLYj1AA0FOMjbtjr1JPBr-_cICgXNUo-72GSg632neJXvlXx8UzV/exec"; // ← ★GASのURLを入れる

  let currentSessionId = "";

  // 1. フォーム送信処理
  document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = "送信中...";

    const formData = {
      name: document.getElementById('name').value,
      dogName: document.getElementById('dogName').value,
      email: document.getElementById('email').value,
      message: document.getElementById('message').value
    };

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(formData)
      });

      const result = await response.json();

      if (result.status === 'success') {
        // 発行されたセッションIDを保持
        currentSessionId = result.sessionId;

        // フォームを非表示にし、LINE案内画面を表示
        document.getElementById('contactForm').style.display = 'none';
        document.getElementById('lineNoticeArea').style.display = 'block';
      } else {
        alert('送信に失敗しました。時間をおいて再度お試しください。');
        submitBtn.disabled = false;
        submitBtn.textContent = "送信する";
      }
    } catch (err) {
      console.error(err);
      alert('通信エラーが発生しました。');
      submitBtn.disabled = false;
      submitBtn.textContent = "送信する";
    }
  });

  // 2. 「LINEで相談を続ける」ボタンタップ時の処理
  document.getElementById('lineConnectBtn').addEventListener('click', () => {
    if (!currentSessionId) {
      alert('エラーが発生しました。フォームを最初からやり直してください。');
      return;
    }

    // LINEの送信欄に自動セットする文章（装飾付き）
    const msgText = 
      "ご相談コード：" + currentSessionId + "\n\n\n\n" +
      "━━━━━━━━━━━━━━━━━\n" +
      " 🐾 アトリエ桂 Web連携 🐾\n" +
      "━━━━━━━━━━━━━━━━━\n" +
      "※上のコードを消さずに\n" +
      " このまま送信ボタンを押してください\n \n" +
      " Send ───> [ 📤 送信 ]";

    // LINEアプリを起動してトーク画面を開くディープリンク
    const lineUrl = "https://line.me/R/oaMessage/" + LINE_BASIC_ID + "/?" + encodeURIComponent(msgText);

    // LINEアプリを起動
    window.location.href = lineUrl;
  });
</script>
</body>
</html>
