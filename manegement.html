<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B1D2F">
<title>Atelier Katsura｜制作・オーダー管理</title>
<style>
:root {
  --navy: #0A162C;
  --bordeaux: #6B1D2F;
  --gold: #C5A880;
  --ivory: #FBF9F5;
  --ink: #182235;
  --muted: #646E7E;
  --line: #E7E3DC;
  --card: #ffffff;
  --soft: #F3F1EC;
  --green: #2E7D62;
  --amber: #B7791F;
  --red: #A63D40;
  --blue: #2B6CB0;
  --shadow: 0 8px 28px rgba(10,22,44,.07);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--ivory);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Yu Gothic", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

.app { min-height: 100vh; padding-bottom: 60px; }

/* ヘッダー (#6B1D2F) */
.topbar {
  position: sticky; top: 0; z-index: 40;
  height: 64px; background: var(--bordeaux);
  color: #fff; border-bottom: 1px solid rgba(0,0,0,.1);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; box-shadow: 0 2px 10px rgba(0,0,0,.15);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { font-family: Georgia, serif; font-size: 16px; letter-spacing: .08em; color: #fff; font-weight: 700; }
.brand-sub { font-size: 11px; color: rgba(255,255,255,.8); letter-spacing: .12em; }
.ext-link-btn {
  border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.1); border-radius: 8px;
  padding: 6px 10px; font-size: 11px; font-weight: 700; color: #fff; text-decoration: none;
}

.screen { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
.page-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.page-title { font-family: Georgia, "Noto Serif JP", serif; font-size: 24px; margin: 0; color: var(--navy); }

/* 検索・ソート フィルターバー */
.filter-bar {
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; margin-bottom: 20px; box-shadow: var(--shadow);
  display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
}
.search-input-wrap { flex: 1; min-width: 200px; position: relative; }
.search-input {
  width: 100%; border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px 8px 32px; font-size: 13px; background: var(--ivory); outline: none;
}
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
.sort-select-wrap { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--navy); }
.sort-select { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; background: #fff; outline: none; }

/* 一覧グループ */
.status-group-section { margin-bottom: 32px; }
.status-group-title {
  font-size: 15px; font-weight: 700; padding: 8px 14px; border-radius: 8px; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between; letter-spacing: .04em;
}
.group-active { background: #FFF4DD; color: var(--amber); border-left: 4px solid var(--amber); }
.group-todo { background: #E2E8F0; color: #4A5568; border-left: 4px solid #718096; }
.group-completed { background: #EAF4EF; color: var(--green); border-left: 4px solid var(--green); }
.group-delivered { background: #EBF8FF; color: var(--blue); border-left: 4px solid var(--blue); }
.group-canceled { background: #FFF5F5; color: var(--red); border-left: 4px solid var(--red); }

/* 作品カード */
.work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.work-card {
  text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; box-shadow: var(--shadow); transition: transform .15s;
  display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; min-height: 175px;
}
.work-card:active { transform: scale(.98); }
.work-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.work-name { font-weight: 700; font-size: 16px; color: var(--navy); }
.work-owner { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* 商品タイプタグ */
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 10px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.badge.kimono { background: #FBE8E8; color: var(--bordeaux); border: 1px solid #F5C6C6; }
.badge.cafemat { background: #EBF8FF; color: var(--blue); border: 1px solid #BEE3F8; }

.work-event { margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--ink); min-height: 20px; }
.work-event-placeholder { min-height: 20px; margin-top: 8px; }

.progress-bar-bg { height: 6px; background: #EDEAE4; border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
.progress-bar-fill { display: block; height: 100%; background: var(--navy); border-radius: inherit; }

.work-meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; margin-top: 4px; }
.consult-code-text { font-family: monospace; font-size: 10px; color: #94A3B8; }

/* ナビゲーションサブヘッダー */
.detail-head {
  position: sticky; top: 64px; z-index: 30; background: rgba(251,249,245,.97);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  margin: -20px -16px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.back-btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; color: var(--navy); font-weight: 700; font-size: 12px; }

.nav-switch-lg-btn {
  border: 2px solid var(--gold); background: #FFFDF9; border-radius: 12px;
  padding: 10px 18px; color: var(--bordeaux); font-weight: 800; font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px;
  box-shadow: 0 4px 12px rgba(197,168,128,.3); transition: transform .1s;
}
.nav-switch-lg-btn:active { transform: scale(.97); }

.hero-row { display: flex; justify-content: space-between; gap: 14px; align-items: center; margin-bottom: 16px; }
.detail-dog { font-family: Georgia, "Noto Serif JP", serif; font-size: 26px; color: var(--navy); margin: 0; }
.detail-owner { color: var(--muted); font-size: 13px; margin-top: 2px; }

.section { margin-top: 20px; }
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
.section-title { font-family: Georgia, "Noto Serif JP", serif; font-size: 17px; color: var(--navy); margin: 0; }
.section-action {
  border: 1px solid #C9BBA8; background: #fff; color: var(--navy); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; font-weight: 700;
}

/* 工程カード */
.process-list { display: flex; flex-direction: column; gap: 10px; }
.process-card {
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  transition: all .15s ease; position: relative;
}
.process-card.active { border: 2px solid var(--gold); background: #FFFDF9; }
.process-card.done { background: #FAF9F6; opacity: .9; }

.process-top-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.process-info-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; cursor: pointer; }
.process-badge-num {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 800; background: #F0EEE9; color: var(--muted); flex-shrink: 0;
}
.process-card.done .process-badge-num { background: #EAF4EF; color: var(--green); }
.process-card.active .process-badge-num { background: #C5A880; color: #fff; }

.process-name { font-size: 14px; font-weight: 700; color: var(--navy); }
.process-time { font-size: 11px; color: var(--muted); margin-top: 1px; }

.process-actions-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.toggle-btn-inline {
  border: 1px solid #C9BBA8; background: #FAF7F2; color: var(--navy);
  border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 4px;
}

.status-display-btn {
  font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 8px;
  border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
}
.status-display-btn.todo { background: #EDF2F7; color: #4A5568; border-color: #CBD5E0; }
.status-display-btn.active { background: #FFF0D4; color: var(--amber); border-color: #E8D2A7; }
.status-display-btn.done { background: #EAF4EF; color: var(--green); border-color: #A3D9C9; }

.process-photos-container { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.process-photos-container.open { display: block; }

.toggle-inner-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 640px) {
  .toggle-inner-grid { grid-template-columns: 2fr 1.2fr; }
}

.photo-3col-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.photo-item-card { background: #FAF9F6; border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.photo-thumb { aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: #EEEAE2; border: 1px solid var(--line); position: relative; cursor: pointer; width: 100%; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* 写真下のメモ表示部分（最初2行まで、タップでプレビュー＆編集モーダルへ） */
.photo-memo-preview-box {
  background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  font-size: 11px; color: var(--ink); cursor: pointer; min-height: 38px; max-height: 44px;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3;
}
.photo-memo-preview-box:hover { background: #FFFDF9; border-color: var(--gold); }
.photo-memo-preview-box.empty { color: #94A3B8; font-style: italic; }

.photo-del-btn {
  position: absolute; top: 4px; right: 4px; z-index: 10;
  width: 22px; height: 22px; border-radius: 50%; background: rgba(166,61,64,.85);
  color: #fff; border: none; font-size: 12px; font-weight: bold;
  display: grid; place-items: center; cursor: pointer; line-height: 1;
  box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .1s;
}
.photo-del-btn:active { transform: scale(.9); background: var(--red); }

.add-photo-btn-square {
  aspect-ratio: 1; border: 1px dashed #C8BDAE; background: #FCFAF6; border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--navy); font-size: 11px; font-weight: 700; cursor: pointer; width: 100%;
}
.add-photo-btn-square:active { background: #F0ECE6; }

.step-right-col { display: flex; flex-direction: column; gap: 8px; justify-content: space-between; height: 100%; }
.step-memo-input {
  width: 100%; height: 72px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  padding: 8px; font-size: 12px; line-height: 1.4; resize: vertical; color: var(--ink);
}

.step-related-info {
  background: #FAF7F2; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  font-size: 11px; color: var(--ink); line-height: 1.4; flex: 1; display: flex; flex-direction: column; justify-content: center;
}
.step-related-title { font-weight: 700; color: var(--bordeaux); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
.step-related-item { margin-top: 2px; }

.memo-area {
  width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 12px; background: #fff;
  padding: 10px; font-size: 13px; line-height: 1.6; resize: vertical; color: var(--ink);
}

/* オーダー情報ページ */
.order-sec-card {
  background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow);
}
.order-sec-title {
  font-family: Georgia, "Noto Serif JP", serif; font-size: 16px; color: var(--navy); margin: 0 0 16px;
  padding-bottom: 8px; border-bottom: 2px solid var(--soft); display: flex; justify-content: space-between; align-items: center;
}

.dog-profile-row-lg { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; }
.dog-avatar-wrap {
  position: relative; width: 140px; height: 140px; border-radius: 14px; border: 2px solid var(--gold); overflow: hidden; background: #EEEAE2; flex-shrink: 0;
}
.dog-avatar-lg { width: 100%; height: 100%; object-fit: cover; display: block; }
.dog-avatar-overlay-btn {
  position: absolute; inset: 0; background: rgba(10,22,44,.5); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; opacity: 0; transition: opacity .15s; cursor: pointer;
}
.dog-avatar-wrap:hover .dog-avatar-overlay-btn { opacity: 1; }

.info-cell-view { background: var(--soft); padding: 10px 12px; border-radius: 10px; }
.info-cell-view .lbl { font-size: 11px; font-weight: 700; color: var(--navy); margin-bottom: 2px; }
.info-cell-view .val { font-size: 14px; font-weight: 700; color: var(--ink); }

.info-grid-spacious { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }

.info-grid-edit { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.info-cell-edit { background: var(--soft); padding: 10px 12px; border-radius: 8px; }
.info-cell-edit label { font-size: 11px; font-weight: 700; color: var(--navy); display: block; margin-bottom: 4px; }

.input-with-unit { display: flex; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding-right: 8px; }
.input-with-unit input { width: 100%; border: none; padding: 6px 8px; font-size: 13px; font-weight: 700; background: transparent; outline: none; }
.input-with-unit .unit { font-size: 12px; font-weight: 700; color: var(--muted); user-select: none; }

/* 詳細オーダー表 */
.detail-order-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.detail-order-table th, .detail-order-table td {
  padding: 10px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--line); vertical-align: middle;
}
.detail-order-table th { width: 32%; color: var(--navy); font-weight: 700; background: #FAF9F6; }

.detail-edit-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.detail-edit-row input { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
.detail-edit-key { width: 35%; font-weight: 700; }
.detail-edit-val { flex: 1; }

.tsv-textarea {
  width: 100%; height: 80px; border: 1px solid var(--line); border-radius: 8px; padding: 8px;
  font-size: 12px; font-family: monospace; line-height: 1.4; white-space: pre; margin-top: 6px;
}

/* モーダル共通 */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(10,22,44,.6);
  backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal-card {
  background: #fff; width: 100%; max-width: 500px; max-height: 85vh; border-radius: 16px;
  display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,.2);
}
.modal-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.modal-title { font-weight: 700; font-size: 15px; color: var(--navy); margin: 0; }
.modal-body { padding: 16px; overflow-y: auto; flex: 1; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; background: #FAF9F6; }

/* 画像プレビュー＆メモ編集モーダル */
.image-modal-card {
  background: #111; width: 100%; max-width: 560px; max-height: 90vh; border-radius: 16px; overflow: hidden;
  display: flex; flex-direction: column; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,.6);
}
.image-modal-body {
  position: relative; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 220px; padding: 20px; background: #000;
}
.image-modal-body img { max-width: 100%; max-height: 50vh; object-fit: contain; display: block; }
.image-modal-close {
  position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7); color: #fff;
  border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 20px;
  display: grid; place-items: center; cursor: pointer; z-index: 101;
}
.image-modal-footer {
  background: #1e1e1e; color: #fff; padding: 16px 20px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 6px;
}
.image-modal-footer label { font-size: 11px; font-weight: 700; color: var(--gold); }
.image-modal-textarea {
  width: 100%; height: 76px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px;
  color: #fff; padding: 8px; font-size: 13px; resize: vertical; outline: none;
}
.image-modal-textarea:focus { border-color: var(--gold); }

/* ボタン立体スタイル */
.btn-sec {
  border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 9px 16px;
  font-size: 12px; font-weight: 700; color: var(--ink); box-shadow: 0 2px 4px rgba(0,0,0,.06);
  transition: all .1s ease;
}
.btn-sec:active { transform: translateY(1px); box-shadow: none; }

.btn-pri {
  border: 0; background: var(--navy); border-radius: 8px; padding: 9px 18px;
  font-size: 12px; font-weight: 700; color: #fff; box-shadow: 0 3px 8px rgba(10,22,44,.2);
  transition: all .1s ease;
}
.btn-pri:active { transform: translateY(1px); box-shadow: none; }

.btn-danger {
  border: 0; background: var(--red); border-radius: 8px; padding: 9px 16px;
  font-size: 12px; font-weight: 700; color: #fff; box-shadow: 0 3px 8px rgba(166,61,64,.2);
  transition: all .1s ease;
}
.btn-danger:active { transform: translateY(1px); box-shadow: none; }

.btn-success {
  border: 0; background: var(--green); border-radius: 8px; padding: 9px 16px;
  font-size: 12px; font-weight: 700; color: #fff; box-shadow: 0 3px 8px rgba(46,125,98,.2);
  transition: all .1s ease;
}
.btn-success:active { transform: translateY(1px); box-shadow: none; }

.btn-blue {
  border: 0; background: var(--blue); border-radius: 8px; padding: 9px 16px;
  font-size: 12px; font-weight: 700; color: #fff; box-shadow: 0 3px 8px rgba(43,108,176,.2);
  transition: all .1s ease;
}
.btn-blue:active { transform: translateY(1px); box-shadow: none; }
.btn-blue:disabled, .btn-blue.disabled {
  background: #CBD5E0 !important; color: #718096 !important; box-shadow: none !important;
  cursor: not-allowed !important; opacity: 0.7;
}

/* ドラッグ＆ドロップ */
.edit-step-item {
  display: flex; align-items: center; gap: 8px; padding: 8px; background: #FAF9F6;
  border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px;
  position: relative; transition: border-color .1s, transform .1s;
}
.edit-step-item.dragging { opacity: 0.3; background: #E2E8F0; }
.drag-handle {
  cursor: grab; color: var(--muted); font-size: 18px; padding: 4px 8px; user-select: none;
  background: #EFECE6; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center;
}
.drag-handle:active { cursor: grabbing; background: var(--gold); color: #fff; }
.edit-step-item input { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; }

.edit-step-item.drop-above::before {
  content: ""; position: absolute; top: -5px; left: 0; right: 0; height: 4px;
  background: var(--blue); border-radius: 2px; box-shadow: 0 0 6px rgba(43,108,176,.5); z-index: 10;
}
.edit-step-item.drop-below::after {
  content: ""; position: absolute; bottom: -5px; left: 0; right: 0; height: 4px;
  background: var(--blue); border-radius: 2px; box-shadow: 0 0 6px rgba(43,108,176,.5); z-index: 10;
}

.file-input { display: none; }
.form-group { margin-bottom: 12px; }
.form-group label { font-size: 11px; font-weight: 700; color: var(--navy); display: block; margin-bottom: 4px; }
.form-group input, .form-group select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 13px; }

.warning-box {
  background: #FFF5F5; border-left: 4px solid var(--red); padding: 10px 12px;
  border-radius: 4px; font-size: 12px; color: #9B2C2C; margin-bottom: 12px; font-weight: 600;
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">Atelier Katsura</div>
      <div class="brand-sub">制作管理</div>
    </div>
    <a href="javascript:void(0)" onclick="goToMainPage()" class="ext-link-btn">メインページへ ↗</a>
  </header>

  <main id="app"></main>
</div>

<!-- アップローダー -->
<input id="photoPicker" class="file-input" type="file" accept="image/*" capture="environment" multiple>
<input id="clientPhotoPicker" class="file-input" type="file" accept="image/*" capture="environment" multiple>
<input id="dogAvatarPicker" class="file-input" type="file" accept="image/*" capture="environment">

<!-- 画像プレビュー＆メモ編集モーダル -->
<div id="imageModal" class="modal-overlay" onclick="closeImageModal()">
  <div class="image-modal-card" onclick="event.stopPropagation()">
    <div class="image-modal-body">
      <button class="image-modal-close" onclick="closeImageModal()">✕</button>
      <img id="imageModalTarget" src="" alt="拡大プレビュー">
    </div>
    <div class="image-modal-footer">
      <label>📌 この写真のメモ (編集可能)</label>
      <textarea id="imageModalMemoInput" class="image-modal-textarea" oninput="onActiveModalMemoInput(this.value)" placeholder="この写真に関するメモを入力..."></textarea>
    </div>
  </div>
</div>

<!-- 工程完了確認モーダル -->
<div id="doneConfirmModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-head"><h3 class="modal-title">工程の完了確認</h3></div>
    <div class="modal-body">
      <p style="margin:0 0 10px; font-size:13px;">以下の工程を<strong>「完了」</strong>にしますか？</p>
      <div id="doneTargetName" style="font-weight:700; font-size:15px; color:var(--navy); background:var(--soft); padding:8px 10px; border-radius:6px; margin-bottom:12px;"></div>
      <textarea id="doneModalMemo" class="step-memo-input" style="height:90px;" placeholder="この工程でのこだわり・気付きを入力..."></textarea>

    <div class="modal-foot">
      <button class="btn-sec" onclick="closeDoneModal()">キャンセル</button>
      <button class="btn-pri" onclick="confirmDoneProcess()">完了にする</button>

  </div>
</div>

<!-- 作品ステータス確認モーダル -->
<div id="workStatusConfirmModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-head"><h3 class="modal-title" id="workModalTitle">作品ステータスの変更確認</h3></div>
    <div class="modal-body">
      <p id="workModalMessage" style="margin:0 0 12px; font-size:14px; font-weight:700; color:var(--navy);"></p>
      <div id="workModalWarning" class="warning-box" style="display:none;"></div>
      <p id="workModalSubText" style="font-size:12px; color:var(--muted); margin:0;"></p>

    <div class="modal-foot">
      <button class="btn-sec" onclick="closeWorkStatusModal()">キャンセル</button>

</div>

<!-- 管理者モード切替モーダル -->
<div id="adminModeConfirmModal" class="modal-overlay">

      <div class="warning-box" style="margin-bottom:10px;">⚠️ 重要な設定情報が含まれます。</div>

        基本情報や採寸データ、詳細オーダー情報を編集可能な状態にします。<br>編集を行いますか？

      <button class="btn-sec" onclick="closeAdminModeModal()">キャンセル</button>

  </div>
</div>

<!-- 工程編集モーダル -->
<div id="stepEditModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-head"><h3 class="modal-title">⚙ 制作工程の編集</h3></div>
    <div class="modal-body">
      <p style="font-size:11px; color:var(--muted); margin:0 0 10px;">☷ 部分を掴んで移動すると工程順を並べ替えられます。</p>

      <button class="btn-sec" style="width:100%; margin-top:6px; border-style:dashed;" onclick="addModalStep()">＋ 新しい工程を追加</button>

    <div class="modal-foot">
      <button class="btn-sec" onclick="closeStepEditModal()">キャンセル</button>

</div>

<!-- 手動作品追加モーダル -->
<div id="addWorkModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-head"><h3 class="modal-title">＋ 新しい作品の追加</h3></div>
    <div class="modal-body">
      <div class="form-group">
        <label>商品タイプ</label>
        <select id="newWorkProductType">
          <option value="着物">犬用着物</option>
          <option value="カフェマット">カフェマット</option>
        </select>
      </div>
      <div class="form-group">
        <label>ワンちゃんのお名前 (「くん」「ちゃん」自動補完)</label>
        <input type="text" id="newWorkDog" placeholder="例: モモ">
      </div>
      <div class="form-group">
        <label>性別</label>
        <select id="newWorkSex">
          <option value="女の子">女の子 (「ちゃん」)</option>
          <option value="男の子">男の子 (「くん」)</option>
        </select>
      </div>
      <div class="form-group">
        <label>犬種</label>
        <input type="text" id="newWorkBreed" placeholder="例: トイプードル">

      <div class="form-group">

        <label>着用予定のイベント (着物の場合のみ入力)</label>

<script>
const MAIN_PAGE_URL = "https://atelier-katsura.example.com"; 

function goToMainPage() {
  if (MAIN_PAGE_URL && !MAIN_PAGE_URL.includes("example.com")) {
    window.location.href = MAIN_PAGE_URL;
  } else {
    alert("「メインページへ」のリンク先URLは未設定です。");
  }
}

function cleanDogName(rawName) {
  return String(rawName || "").replace(/(ちゃん|くん)$/, "").trim();
}

function getFormattedDogName(rawName, sex) {
  const base = cleanDogName(rawName);
  if (!base) return "";
  const suffix = (sex === "男の子") ? "くん" : "ちゃん";
  return base + suffix;
}

function parseOrderDateFromCode(code) {
  if (!code) return "0000-00-00";
  const m = code.match(/S_(\d{4})(\d{2})(\d{2})_/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return "0000-00-00";
}

const DEFAULT_STEPS = [
  { id: "s1", name: "型紙・布を決める", time: "—", status: "todo", memo: "" },
  { id: "s2", name: "布の準備・印付け", time: "約1〜1.5時間", status: "todo", memo: "" },
  { id: "s3", name: "裁断・パーツ整理", time: "約1時間10分", status: "todo", memo: "" },
  { id: "s4", name: "袖を仕立てる", time: "約3時間40分", status: "todo", memo: "" },
  { id: "s5", name: "見頃を仕立てる", time: "約3時間20分", status: "todo", memo: "" },
  { id: "s6", name: "裾を仕立てる", time: "約3時間30分", status: "todo", memo: "" },
  { id: "s7", name: "全体を仕立てる", time: "約5時間", status: "todo", memo: "" },
  { id: "s8", name: "半襟を付ける", time: "約2時間", status: "todo", memo: "" }
];

const sampleDogNames = ["モモ", "チョコ", "ココ", "マロン", "ハナ", "レオ", "ソラ", "ポチ", "フク", "ムギ", "ベル", "モカ", "サクラ", "ルーク", "ルナ", "マル", "ユキ", "カイ", "コテツ", "ナナ"];
const sampleBreeds = ["トイプードル", "ミニチュアダックス", "チワワ", "柴犬", "ポメラニアン", "マルチーズ", "フレンチブルドッグ", "シーズー", "パグ", "ヨークシャーテリア"];
const sampleOwners = ["山田", "木村", "佐藤", "田中", "鈴木", "高橋", "渡辺", "伊藤", "中村", "小林", "加藤", "吉田", "山本", "松本", "井上"];
const sampleEvents = ["お正月の初詣で着用", "七五三の記念撮影", "成人式記念撮影", "親戚の結婚式出席", "年賀状用写真撮影", "1歳のバースデー記念", "桜ロケーション撮影", "お雛祭り撮影"];
const sampleColors = ["赤・ゴールド系（華やか）", "紫・シック系", "ブラウン・ベージュ系", "ピンク・可愛い系", "紺・凛とした雰囲気", "抹茶・伝統和風", "白・清楚", "黒・豪華金らん"];
const sampleStatuses = ["active", "todo", "completed", "delivered", "canceled"];

function generateBulkWorks(count = 97) {
  const list = [
    {
      id: "momo", consultCode: "S_20260526_A819X2", workStatus: "active", productType: "着物",
      dogBaseName: "モモ", dogSex: "女の子", dogBreed: "トイプードル", owner: "山田", event: "成人式記念撮影", contactTool: "LINE", weight: "3.2kg", due: "2026-12-25", deliveredAt: null,
      basicOrder: { photo: "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=400&q=80", neck: "22", chest: "35", length: "28", neckToHip: "26", preferredColor: "赤・ゴールド系", avoidPattern: "大ぶりの髑髏柄" },
      clientPhotos: [
        { id: "cp1", src: "https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?auto=format&fit=crop&w=400&q=80", memo: "正面からの全身写真です。お尻周りのボリューム感もこちらで確認できます。" }
      ],
      detailOrder: [{ key: "使用する生地", val: "正絹 雲取り花菱文様（赤）" }, { key: "帯仕様", val: "金襴織 扇面重ね" }],
      steps: DEFAULT_STEPS.map((s, i) => i < 3 ? { ...s, status: "done" } : i === 3 ? { ...s, status: "active" } : { ...s }),
      photos: [{ id: "p1", stepId: "s4", src: "https://images.unsplash.com/photo-1602523961358-f9f03dd557db?auto=format&fit=crop&w=500&q=80", memo: "袖の縫い合わせ途中。裏地の柄合わせを入念に行いました。" }], 
      manualOpenStepIds: [], workMemo: "柄合わせをしっかり確認。"
    },
    {
      id: "choko", consultCode: "S_20260601_B231Y9", workStatus: "active", productType: "カフェマット",
      dogBaseName: "チョコ", dogSex: "男の子", dogBreed: "ミニチュアダックス", owner: "木村", event: "", contactTool: "メール", weight: "4.8kg", due: "2026-11-15", deliveredAt: null,
      basicOrder: { photo: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=400&q=80", neck: "24", chest: "38", length: "32", neckToHip: "30", preferredColor: "ブラウン・ベージュ系", avoidPattern: "原色チェック" },
      clientPhotos: [], detailOrder: [{ key: "マットサイズ", val: "50cm × 40cm" }],
      steps: DEFAULT_STEPS.map((s, i) => i < 2 ? { ...s, status: "done" } : i === 2 ? { ...s, status: "active" } : { ...s }),
      photos: [], manualOpenStepIds: [], workMemo: "滑り止め加工生地向き確認。"
    },
    {
      id: "coco", consultCode: "S_20260610_C782Z4", workStatus: "todo", productType: "着物",
      dogBaseName: "ココ", dogSex: "男の子", dogBreed: "チワワ", owner: "佐藤", event: "七五三の記念撮影", contactTool: "LINE", weight: "2.1kg", due: "2027-01-18", deliveredAt: null,
      basicOrder: { neck: "19", chest: "30", length: "22", neckToHip: "20", preferredColor: "紫・シック系", avoidPattern: "ピンク系" },
      clientPhotos: [], detailOrder: [], steps: DEFAULT_STEPS.map(s => ({ ...s })), photos: [], manualOpenStepIds: [], workMemo: "古布裁断前チェック。"
    }
  ];

  for (let i = 1; i <= count; i++) {
    const pType = (i % 3 === 0) ? "カフェマット" : "着物";
    const status = sampleStatuses[i % sampleStatuses.length];
    const sex = (i % 2 === 0) ? "女の子" : "男の子";
    const name = sampleDogNames[i % sampleDogNames.length] + (i > 20 ? i : "");
    const breed = sampleBreeds[i % sampleBreeds.length];
    const owner = sampleOwners[i % sampleOwners.length];
    const event = (pType === "着物") ? sampleEvents[i % sampleEvents.length] : "";
    const color = sampleColors[i % sampleColors.length];
    
    const month = String((i % 12) + 1).padStart(2, '0');
    const day = String((i % 28) + 1).padStart(2, '0');
    const dueYear = (i % 2 === 0) ? "2026" : "2027";
    const dueStr = `${dueYear}-${month}-${day}`;

    const codeDateStr = `2026${String((i%6)+5).padStart(2,'0')}${String((i%25)+1).padStart(2,'0')}`;
    const randStr = Math.random().toString(36).substring(2, 8).toUpperCase();
    const consultCode = `S_${codeDateStr}_${randStr}`;

    const neckVal = 18 + (i % 15);
    const chestVal = neckVal + 10 + (i % 8);
    const lengthVal = 20 + (i % 12);
    const neckToHipVal = lengthVal + 2 + (i % 5);

    let steps = DEFAULT_STEPS.map(s => ({ ...s }));
    if (status === "completed" || status === "delivered") {
      steps = steps.map(s => ({ ...s, status: "done" }));
    } else if (status === "active") {
      const activeIdx = i % 6;
      steps = steps.map((s, idx) => idx < activeIdx ? { ...s, status: "done" } : idx === activeIdx ? { ...s, status: "active" } : { ...s });
    }

    list.push({
      id: `w_auto_${i}`,
      consultCode: consultCode,
      workStatus: status,
      productType: pType,
      dogBaseName: name,
      dogSex: sex,
      dogBreed: breed,
      owner: owner,
      event: event,
      contactTool: (i % 2 === 0) ? "LINE" : "メール",
      weight: `${(2.0 + (i % 8) * 0.5).toFixed(1)}kg`,
      due: dueStr,
      deliveredAt: status === "delivered" ? `${dueStr} 14:00` : null,
      basicOrder: { photo: "", neck: String(neckVal), chest: String(chestVal), length: String(lengthVal), neckToHip: String(neckToHipVal), preferredColor: color, avoidPattern: "特になし" },
      clientPhotos: [],
      detailOrder: [{ key: "裏地仕様", val: "正絹 羽二重（白）" }],
      steps: steps,
      photos: [],
      manualOpenStepIds: [],
      workMemo: `サンプル作品 #${i} の注意事項メモ`
    });
  }
  return list;
}

const works = generateBulkWorks(97);

let activeWorkId = null;
let currentTab = "production";
let pendingPhotoStepId = null;
let pendingDoneStepId = null;
let pendingTargetWorkStatus = null;
let editingStepsTemp = [];
let isOrderAdminEditMode = false;

let searchQuery = "";
let currentSortMode = "default";

// 現在プレビュー・編集中の写真オブジェクトへの参照
let activeModalPhotoRef = null;

const app = document.getElementById("app");
const picker = document.getElementById("photoPicker");
const clientPicker = document.getElementById("clientPhotoPicker");
const dogAvatarPicker = document.getElementById("dogAvatarPicker");

function getWork() { return works.find(w => w.id === activeWorkId); }
function completedCount(w) { return w.steps.filter(s => s.status === "done").length; }
function progressPct(w) { return Math.round((completedCount(w) / w.steps.length) * 100) || 0; }
function escapeHtml(v) { return String(v ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }

function openImageModal(photoObj) {
  activeModalPhotoRef = photoObj;
  document.getElementById("imageModalTarget").src = photoObj.src;
  document.getElementById("imageModalMemoInput").value = photoObj.memo || "";
  document.getElementById("imageModal").classList.add("open");
}

function closeImageModal() {
  document.getElementById("imageModal").classList.remove("open");
  activeModalPhotoRef = null;
  renderScreen(); // 画面側のプレビュー表示も即時更新
}

function onActiveModalMemoInput(val) {
  if (activeModalPhotoRef) {
    activeModalPhotoRef.memo = val;
  }
}

// ---- 1. ホーム画面 ----
function renderList() {
  activeWorkId = null;
  isOrderAdminEditMode = false;

  const existingFilterBar = document.getElementById("filterBarContainer");

  if (!existingFilterBar) {
    app.innerHTML = `
      <section class="screen">
        <div class="page-header-flex">
          <h1 class="page-title">制作中の作品一覧 (${works.length}件)</h1>
          <button class="btn-pri" onclick="openAddWorkModal()">＋ 手動で作品を追加</button>
        </div>

        <div id="filterBarContainer"></div>
        <div id="groupsContainer"></div>
      </section>
    `;
    renderFilterBar();
  }

  renderGroupsContent();
}

function renderFilterBar() {
  const container = document.getElementById("filterBarContainer");
  if (!container) return;

  container.innerHTML = `
    <div class="filter-bar">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" value="${escapeHtml(searchQuery)}" placeholder="愛犬名、飼い主名、イベント、コード等で検索...">
      </div>
      
      <div class="sort-select-wrap">
        <span>並び替え:</span>
        <select id="sortSelect" class="sort-select">
          <option value="default" ${currentSortMode === 'default' ? 'selected' : ''}>グループ標準順</option>
          <option value="due" ${currentSortMode === 'due' ? 'selected' : ''}>納期が近い順</option>
          <option value="neckToHip" ${currentSortMode === 'neckToHip' ? 'selected' : ''}>首〜お尻の長さ順 (長い順)</option>
          <option value="orderDate" ${currentSortMode === 'orderDate' ? 'selected' : ''}>受注日時順 (新しい順)</option>
        </select>
      </div>
    </div>
  `;

  const searchInput = document.getElementById("searchInput");
  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderGroupsContent();
  });

  const sortSelect = document.getElementById("sortSelect");
  sortSelect.addEventListener("change", (e) => {
    currentSortMode = e.target.value;
    renderList();
  });
}

function renderGroupsContent() {
  const groupsContainer = document.getElementById("groupsContainer");
  if (!groupsContainer) return;

  const q = searchQuery.trim().toLowerCase();

  function sortWorksList(list) {
    if (currentSortMode === "due") {
      return [...list].sort((a, b) => (a.due || "9999-99-99").localeCompare(b.due || "9999-99-99"));
    } else if (currentSortMode === "neckToHip") {
      return [...list].sort((a, b) => (parseFloat(b.basicOrder?.neckToHip || 0) - parseFloat(a.basicOrder?.neckToHip || 0)));
    } else if (currentSortMode === "orderDate") {
      return [...list].sort((a, b) => parseOrderDateFromCode(b.consultCode).localeCompare(parseOrderDateFromCode(a.consultCode)));
    }
    return list;
  }

  function filterWorksList(list) {
    if (!q) return list;
    return list.filter(w => {
      const dogFormatted = getFormattedDogName(w.dogBaseName, w.dogSex).toLowerCase();
      const owner = (w.owner || "").toLowerCase();
      const event = (w.event || "").toLowerCase();
      const code = (w.consultCode || "").toLowerCase();
      const breed = (w.dogBreed || "").toLowerCase();
      const ptype = (w.productType || "").toLowerCase();
      return dogFormatted.includes(q) || owner.includes(q) || event.includes(q) || code.includes(q) || breed.includes(q) || ptype.includes(q);
    });
  }

  const groups = [
    { key: "active", title: "進行中の作品", class: "group-active" },
    { key: "todo", title: "未着手の作品", class: "group-todo" },
    { key: "completed", title: "完成した作品", class: "group-completed" },
    { key: "delivered", title: "納品済みの作品", class: "group-delivered" },
    { key: "canceled", title: "キャンセル済みの作品", class: "group-canceled" }
  ];

  groupsContainer.innerHTML = groups.map(g => {
    const rawGroupList = works.filter(w => w.workStatus === g.key);
    const filteredGroupList = filterWorksList(rawGroupList);
    const finalGroupList = sortWorksList(filteredGroupList);

    return `
      <div class="status-group-section">
        <div class="status-group-title ${g.class}">
          <span>${g.title}</span>
          <span style="font-size:12px; font-weight:normal;">${finalGroupList.length} / ${rawGroupList.length} 件</span>
        </div>
        ${finalGroupList.length === 0 ? `<p style="font-size:12px; color:var(--muted); padding-left:8px;">該当する作品はありません。</p>` : `
          <div class="work-grid">
            ${finalGroupList.map(w => renderWorkCardHtml(w)).join("")}
          </div>
        `}
      </div>
    `;
  }).join("");
}

function renderWorkCardHtml(w) {
  const dogFormatted = getFormattedDogName(w.dogBaseName, w.dogSex);
  const isKimono = w.productType === "着物";
  const pct = progressPct(w);
  const orderDateStr = parseOrderDateFromCode(w.consultCode);

  return `
    <div class="work-card" onclick="openWork('${w.id}', 'production')">
      <div>
        <div class="work-top">
          <div>
            <div class="work-name">${escapeHtml(dogFormatted)}</div>
            <div class="work-owner">${escapeHtml(w.owner)}様</div>
          </div>
          <span class="badge ${isKimono ? 'kimono' : 'cafemat'}">
            ${w.productType}
          </span>
        </div>
        
        ${isKimono ? `
          <div class="work-event">${escapeHtml(w.event || "着用イベント未設定")}</div>
        ` : `
          <div class="work-event-placeholder"></div>
        `}
      </div>

      <div>
        <div style="font-size:13px; color:var(--ink); margin-top:8px; display:flex; justify-content:space-between; align-items:center;">

function openWork(id, tab = "production") {
  activeWorkId = id;
  currentTab = tab;
  renderScreen();
  window.scrollTo({ top: 0, behavior: "auto" });
}

function renderScreen() {
  const w = getWork();
  if (!w) return renderList();
  if (currentTab === "production") {
    renderProductionScreen(w);
  } else {
    renderOrderScreen(w);
  }
}

function handleStepStatusNext(stepId) {
  const w = getWork();
  if (!w) return;
  const step = w.steps.find(s => s.id === stepId);
  if (!step) return;

  if (step.status === "todo") {
    step.status = "active";
    renderScreen();
  } else if (step.status === "active") {
    pendingDoneStepId = stepId;
    document.getElementById("doneTargetName").innerText = step.name;
    document.getElementById("doneModalMemo").value = step.memo || "";
    document.getElementById("doneConfirmModal").classList.add("open");
  } else if (step.status === "done") {
    if (confirm(`「${step.name}」を未着手に戻しますか？`)) {
      step.status = "todo";
      renderScreen();
    }
  }
}

function closeDoneModal() {
  document.getElementById("doneConfirmModal").classList.remove("open");
  pendingDoneStepId = null;
}

function confirmDoneProcess() {
  const w = getWork();
  if (!w || !pendingDoneStepId) return;
  const step = w.steps.find(s => s.id === pendingDoneStepId);
  if (step) {
    step.status = "done";
    step.memo = document.getElementById("doneModalMemo").value;
  }
  closeDoneModal();
  renderScreen();
}

function togglePhotoArea(e, stepId) {
  e.stopPropagation();
  const w = getWork();
  if (!w) return;
  if (!w.manualOpenStepIds) w.manualOpenStepIds = [];

  const idx = w.manualOpenStepIds.indexOf(stepId);
  if (idx >= 0) {
    w.manualOpenStepIds.splice(idx, 1);
  } else {
    w.manualOpenStepIds.push(stepId);
  }
  renderScreen();
}

function deleteStepPhoto(e, photoId) {
  e.stopPropagation();
  const w = getWork();
  if (!w) return;
  if (confirm("この工程写真を削除しますか？")) {
    w.photos = w.photos.filter(p => p.id !== photoId);
    renderScreen();
  }
}

function deleteClientPhoto(e, photoId) {
  e.stopPropagation();
  const w = getWork();
  if (!w) return;
  if (confirm("この顧客送付写真を削除しますか？")) {
    w.clientPhotos = w.clientPhotos.filter(p => p.id !== photoId);
    renderScreen();
  }
}

function saveStepMemo(stepId, val) {
  const w = getWork();
  if (!w) return;
  const step = w.steps.find(s => s.id === stepId);
  if (step) step.memo = val;
}

function saveWorkMemo(val) {
  const w = getWork();
  if (w) w.workMemo = val;
}

function promptWorkStatusChange(targetStatus) {
  const w = getWork();
  if (!w) return;
  const dogFormatted = getFormattedDogName(w.dogBaseName, w.dogSex);

  pendingTargetWorkStatus = targetStatus;
  
  const titleEl = document.getElementById("workModalTitle");
  const msgEl = document.getElementById("workModalMessage");
  const warnEl = document.getElementById("workModalWarning");
  const subEl = document.getElementById("workModalSubText");
  const confirmBtn = document.getElementById("workModalConfirmBtn");

  warnEl.style.display = "none";
  warnEl.innerHTML = "";

  if (targetStatus === "completed") {
    titleEl.innerText = "✨ 作品の完成確認";
    msgEl.innerText = `「${dogFormatted}」の作品を『完成』にしますか？`;
    subEl.innerText = "完成に変更後、自動的に作品一覧（ホーム）に戻ります。";
    confirmBtn.className = "btn-success";
    confirmBtn.innerText = "完成にする";

    const uncompleted = w.steps.filter(s => s.status !== "done");
    if (uncompleted.length > 0) {
      warnEl.style.display = "block";
      warnEl.innerHTML = `⚠️ 未完了の工程が ${uncompleted.length} 件残っています：<br>・` + 
        uncompleted.map(s => `${s.name} (${s.status === 'active' ? '進行中' : '未着手'})`).join("<br>・");
    }

  } else if (targetStatus === "delivered") {
    titleEl.innerText = "📦 納品の確認";
    msgEl.innerText = `「${dogFormatted}」の作品を『納品済み』にしますか？`;
    subEl.innerText = "納品済みに変更後、自動的に作品一覧（ホーム）に戻ります。";
    confirmBtn.className = "btn-blue";
    confirmBtn.innerText = "納品済みにする";

  } else if (targetStatus === "canceled") {
    titleEl.innerText = "⚠️ キャンセル確認";
    msgEl.innerText = `「${dogFormatted}」の注文を『キャンセル済み』にしますか？`;
    subEl.innerText = "キャンセル変更後、自動的に作品一覧（ホーム）に戻ります。";
    confirmBtn.className = "btn-danger";
    confirmBtn.innerText = "キャンセル済みにする";
  }

  document.getElementById("workStatusConfirmModal").classList.add("open");
}

function closeWorkStatusModal() {
  document.getElementById("workStatusConfirmModal").classList.remove("open");
  pendingTargetWorkStatus = null;
}

function executeWorkStatusChange() {
  const w = getWork();
  if (!w || !pendingTargetWorkStatus) return;

  w.workStatus = pendingTargetWorkStatus;
  
  if (pendingTargetWorkStatus === "delivered") {
    const now = new Date();
    w.deliveredAt = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  }

  closeWorkStatusModal();
  renderList();
}

function triggerAddPhoto(e, stepId) {
  e.stopPropagation();
  pendingPhotoStepId = stepId;
  picker.value = "";
  picker.click();
}

picker.addEventListener("change", (e) => {
  const w = getWork();
  if (!w || !pendingPhotoStepId) return;
  const files = [...e.target.files];
  files.forEach(file => {
    w.photos.push({
      id: "p_" + Date.now() + "_" + Math.random().toString(36).substring(2, 5),
      stepId: pendingPhotoStepId,
      src: URL.createObjectURL(file),
      memo: ""
    });
  });
  if (!w.manualOpenStepIds) w.manualOpenStepIds = [];
  if (!w.manualOpenStepIds.includes(pendingPhotoStepId)) {
    w.manualOpenStepIds.push(pendingPhotoStepId);
  }
  pendingPhotoStepId = null;
  renderScreen();
});

              <div style="display:flex; flex-wrap:wrap; gap:16px; font-size:13px; color:var(--muted); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);">

                <span>納期: <strong style="color:var(--bordeaux);">${escapeHtml(w.due || "未設定")}</strong></span>
              </div>

                <div style="font-size:13px; font-weight:700; color:var(--navy); margin-top:8px;">

                <div class="info-cell-view"><div class="lbl">色の系統</div><div class="val">${escapeHtml(bo.preferredColor || '未指定')}</div></div>
                <div class="info-cell-view"><div class="lbl">避けてほしい絵柄</div><div class="val">${escapeHtml(bo.avoidPattern || 'なし')}</div></div>
              </div>

              <div class="info-grid-spacious">
                <div class="info-cell-view"><div class="lbl">首周り</div><div class="val">${escapeHtml(bo.neck || '—')} cm</div></div>
                <div class="info-cell-view"><div class="lbl">胴回り</div><div class="val">${escapeHtml(bo.chest || '—')} cm</div></div>
                <div class="info-cell-view"><div class="lbl">背丈</div><div class="val">${escapeHtml(bo.length || '—')} cm</div></div>
                <div class="info-cell-view"><div class="lbl">首〜お尻</div><div class="val">${escapeHtml(bo.neckToHip || '—')} cm</div></div>
              </div>
            `}
          </div>
        </div>
      </div>

      <div class="order-sec-card">
        <div class="order-sec-title">
          <span>📷 顧客送付写真 (タップして拡大・メモ編集)</span>
        </div>
        
        <div class="photo-3col-grid">
          ${clientPhotos.map((cp) => {
            const memoTrim = String(cp.memo || "").trim();
            return `
              <div class="photo-item-card">
                <div class="photo-thumb" onclick="openImageModal(works.find(x => x.id === '${w.id}').clientPhotos.find(item => item.id === '${cp.id}'))">
                  ${isOrderAdminEditMode ? `<button class="photo-del-btn" title="削除" onclick="deleteClientPhoto(event, '${cp.id}')">✕</button>` : ''}
                  <img src="${escapeHtml(cp.src)}" alt="顧客送付写真">
                </div>
                <div class="photo-memo-preview-box ${memoTrim ? '' : 'empty'}" onclick="openImageModal(works.find(x => x.id === '${w.id}').clientPhotos.find(item => item.id === '${cp.id}'))" title="タップしてメモを編集">
                  ${memoTrim ? escapeHtml(memoTrim) : (isOrderAdminEditMode ? '写真メモを追加...' : 'メモなし')}
                </div>
              </div>
            `;
          }).join("")}
          
          ${isOrderAdminEditMode ? `
            <button class="add-photo-btn-square" onclick="triggerAddClientPhoto()">
              <span style="font-size:16px;">＋</span>
              <span>写真追加</span>
            </button>
          ` : ''}
        </div>
      </div>

      <div class="order-sec-card">
        <div class="order-sec-title">
          <span>B. 詳細オーダー情報</span>
        </div>

        ${isOrderAdminEditMode ? `
          <p style="font-size:11px; color:var(--muted); margin:0 0 6px;">TSV・コピペで一括更新、または下の各項目を直接編集できます。</p>
          <textarea class="tsv-textarea" id="tsvInput" placeholder="例:&#10;使用する生地	正絹 雲取り花菱文様&#10;帯仕様	金襴織 扇面重ね"></textarea>
          <button class="btn-pri" style="margin-top:6px; margin-bottom:16px; width:100%;" onclick="applyTsvImport()">📋 テキストから表を一括更新</button>

          <div style="font-weight:700; font-size:13px; color:var(--navy); margin-bottom:8px;">個別項目の編集・追加:</div>
          ${(w.detailOrder || []).map((item, idx) => `
            <div class="detail-edit-row">
              <input type="text" class="detail-edit-key" value="${escapeHtml(item.key)}" onchange="updateDetailOrderKey(${idx}, this.value)" placeholder="項目名">
              <input type="text" class="detail-edit-val" value="${escapeHtml(item.val)}" onchange="updateDetailOrderVal(${idx}, this.value)" placeholder="内容">
              <button style="border:none; background:transparent; color:var(--red); font-weight:bold; padding:4px;" onclick="removeDetailOrderItem(${idx})">削除</button>
            </div>
          `).join("")}
          <button class="btn-sec" style="width:100%; margin-top:8px; border-style:dashed; font-size:12px;" onclick="addDetailOrderItem()">＋ 項目を追加</button>
        ` : `
          <table class="detail-order-table" style="margin-top:10px;">
            <tbody>
              ${(w.detailOrder || []).map((item) => `
                <tr>
                  <th>${escapeHtml(item.key)}</th>
                  <td>${escapeHtml(item.val)}</td>
                </tr>
              `).join("")}
              ${(w.detailOrder || []).length === 0 ? `<tr><td colspan="2" style="color:var(--muted);">詳細オーダー情報は登録されていません。</td></tr>` : ''}
            </tbody>
          </table>
        `}
      </div>

      <div style="margin-top:40px; padding-top:16px; border-top:1px solid var(--line); text-align:center;">
        <button class="${isOrderAdminEditMode ? 'btn-danger' : 'btn-sec'}" style="font-size:11px; padding:6px 12px;" onclick="requestAdminModeToggle()">
          ${isOrderAdminEditMode ? '🔒 管理者編集モードを終了する (閲覧専用へ)' : '⚙ 管理者編集モードに切り替える'}
        </button>
      </div>
    </section>
  `;
}

function updateDogBaseName(val) {
  const w = getWork();
  if (w) {
    w.dogBaseName = cleanDogName(val);
    renderOrderScreen(w);
  }
}

function updateDogSex(val) {
  const w = getWork();
  if (w) {
    w.dogSex = val;
    renderOrderScreen(w);
  }
}

function updateWorkField(field, val) {
  const w = getWork();
  if (w) {
    w[field] = val;
  }
}

function updateBasicOrder(key, val) {
  const w = getWork();
  if (w) {
    if (!w.basicOrder) w.basicOrder = {};
    w.basicOrder[key] = val;
  }
}

function updateDetailOrderKey(idx, val) {
  const w = getWork();
  if (w && w.detailOrder && w.detailOrder[idx]) {
    w.detailOrder[idx].key = val;
  }
}

function updateDetailOrderVal(idx, val) {
  const w = getWork();
  if (w && w.detailOrder && w.detailOrder[idx]) {
    w.detailOrder[idx].val = val;
  }
}

function removeDetailOrderItem(idx) {
  const w = getWork();
  if (w && w.detailOrder && w.detailOrder[idx]) {
    const keyName = w.detailOrder[idx].key || "この";
    if (confirm(`詳細オーダー項目「${keyName}」を削除しますか？`)) {
      w.detailOrder.splice(idx, 1);
      renderOrderScreen(w);
    }
  }
}

function addDetailOrderItem() {
  const w = getWork();
  if (w) {
    if (!w.detailOrder) w.detailOrder = [];
    w.detailOrder.push({ key: "新しい項目", val: "" });
    renderOrderScreen(w);
  }
}

function triggerChangeDogAvatar() {
  dogAvatarPicker.value = "";
  dogAvatarPicker.click();
}

dogAvatarPicker.addEventListener("change", (e) => {
  const w = getWork();
  if (!w) return;
  const file = e.target.files[0];
  if (file) {
    if (!w.basicOrder) w.basicOrder = {};
    w.basicOrder.photo = URL.createObjectURL(file);
    renderOrderScreen(w);
  }
});

function triggerAddClientPhoto() {
  clientPicker.value = "";
  clientPicker.click();
}

clientPicker.addEventListener("change", (e) => {
  const w = getWork();
  if (!w) return;
  if (!w.clientPhotos) w.clientPhotos = [];
  [...e.target.files].forEach(file => {
    w.clientPhotos.push({
      id: "cp_" + Date.now() + "_" + Math.random().toString(36).substring(2, 5),
      src: URL.createObjectURL(file),
      memo: ""
    });
  });
  renderOrderScreen(w);
});

function applyTsvImport() {
  const w = getWork();
  if (!w) return;
  const text = document.getElementById("tsvInput").value.trim();
  if (!text) return alert("テキストが入力されていません。");

  const lines = text.split("\n");
  const newDetails = [];
  lines.forEach(line => {
    const parts = line.split("\t");
    if (parts.length >= 2) {
      newDetails.push({ key: parts[0].trim(), val: parts[1].trim() });
    } else if (parts.length === 1 && parts[0].trim()) {
      newDetails.push({ key: "メモ", val: parts[0].trim() });
    }
  });

  w.detailOrder = newDetails;
  renderOrderScreen(w);
  alert("詳細オーダー表を一括更新しました。");
}

// ---- 4. 工程編集モーダル ----
function openStepEditModal() {
  const w = getWork();
  if (!w) return;
  editingStepsTemp = JSON.parse(JSON.stringify(w.steps));
  renderStepEditModalList();
  document.getElementById("stepEditModal").classList.add("open");
}

function closeStepEditModal() {
  document.getElementById("stepEditModal").classList.remove("open");
  editingStepsTemp = [];
}

function renderStepEditModalList() {
  const container = document.getElementById("editStepList");
  container.innerHTML = editingStepsTemp.map((s, idx) => `
    <div class="edit-step-item" data-index="${idx}">
      <span class="drag-handle" draggable="true">☷</span>
      <input type="text" value="${escapeHtml(s.name)}" onchange="editingStepsTemp[${idx}].name = this.value">
      <button style="border:none; background:transparent; color:var(--red); font-weight:700;" onclick="removeModalStep(${idx})">削除</button>
    </div>
  `).join("");

  const items = container.querySelectorAll('.edit-step-item');
  let dragSrcIndex = null;

  items.forEach(item => {
    const handle = item.querySelector('.drag-handle');

    handle.addEventListener('dragstart', (e) => {
      dragSrcIndex = Number(item.getAttribute('data-index'));
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragSrcIndex);
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';

      const rect = item.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      
      items.forEach(i => i.classList.remove('drop-above', 'drop-below'));

      if (e.clientY < midY) {
        item.classList.add('drop-above');
      } else {
        item.classList.add('drop-below');
      }
    });

    item.addEventListener('dragleave', () => {
      item.classList.remove('drop-above', 'drop-below');
    });

    item.addEventListener('drop', (e) => {
      e.preventDefault();
      const dropIndex = Number(item.getAttribute('data-index'));
      const rect = item.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      const isBelow = e.clientY >= midY;

      items.forEach(i => i.classList.remove('drop-above', 'drop-below'));

      if (dragSrcIndex !== null) {
        let targetIndex = isBelow ? dropIndex + 1 : dropIndex;
        if (dragSrcIndex < targetIndex) targetIndex--;

        const movedItem = editingStepsTemp.splice(dragSrcIndex, 1)[0];
        editingStepsTemp.splice(targetIndex, 0, movedItem);
        renderStepEditModalList();
      }
    });

    handle.addEventListener('dragend', () => {
      items.forEach(i => i.classList.remove('dragging', 'drop-above', 'drop-below'));
    });
  });
}

function addModalStep() {
  editingStepsTemp.push({ id: "s_" + Date.now(), name: "新しい工程", time: "目安未設定", status: "todo", memo: "" });
  renderStepEditModalList();
}

function removeModalStep(idx) {
  const w = getWork();
  if (!w) return;
  const targetStep = editingStepsTemp[idx];

  if (editingStepsTemp.length <= 1) {
    return alert("工程は最低1つ必要です。");
  }

  const hasPhotos = w.photos.some(p => p.stepId === targetStep.id);
  const hasMemo = Boolean(targetStep.memo && targetStep.memo.trim());

  if (hasPhotos || hasMemo) {
    return alert(`「${targetStep.name}」には既に写真またはメモが記録されているため削除できません。`);
  }

  if (confirm(`工程「${targetStep.name}」を削除しますか？`)) {
    editingStepsTemp.splice(idx, 1);
    renderStepEditModalList();
  }
}

function saveStepEditModal() {
  const w = getWork();
  if (!w) return;
  w.steps = JSON.parse(JSON.stringify(editingStepsTemp));
  closeStepEditModal();
  renderScreen();
}

// ---- 5. 手動作品追加 ----
function openAddWorkModal() {
  document.getElementById("addWorkModal").classList.add("open");
}
function closeAddWorkModal() {
  document.getElementById("addWorkModal").classList.remove("open");
}
function saveNewWork() {
  const type = document.getElementById("newWorkProductType").value;
  const rawDog = document.getElementById("newWorkDog").value.trim() || "無題";
  const sex = document.getElementById("newWorkSex").value;
  const breed = document.getElementById("newWorkBreed").value.trim() || "未設定";
  const owner = document.getElementById("newWorkOwner").value.trim() || "未設定";
  const event = document.getElementById("newWorkEvent").value.trim() || "イベント未設定";
  const due = document.getElementById("newWorkDue").value;

  const now = new Date();
  const dateStr = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
  const randomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
  const consultCode = `S_${dateStr}_${randomCode}`;

  const newWork = {
    id: "w_" + Date.now(),
    consultCode: consultCode,
    workStatus: "todo",
    productType: type,
    dogBaseName: cleanDogName(rawDog),
    dogSex: sex,
    dogBreed: breed,
    owner: owner,
    event: event,
    contactTool: "LINE",
    weight: "未設定",
    due: due,
    deliveredAt: null,
    basicOrder: { photo: "", neck: "", chest: "", length: "", neckToHip: "", preferredColor: "", avoidPattern: "" },
    clientPhotos: [],
    detailOrder: [],
    steps: DEFAULT_STEPS.map(s => ({ ...s })),
    photos: [], manualOpenStepIds: [], workMemo: ""
  };

  works.unshift(newWork);
  closeAddWorkModal();
  renderList();
}

renderList();
</script>
